services:
  ros2:
    build:
      context: .
      dockerfile: ${DOCKERFILE}
    container_name: ${CONTAINER_NAME}
    privileged: true
    network_mode: host
    ipc: host
    pid: host

    environment:
      - DISPLAY=${DISPLAY}
      #- XAUTHORITY=${XAUTHORITY}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=90

    volumes:
      - ./src:/home/developer/mirsws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
      #- ${XAUTHORITY}:${XAUTHORITY}:ro

    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1

    stdin_open: true
    tty: true
    command: bash
