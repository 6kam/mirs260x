services:
  jazzy:
    build: .
    privileged: true
    network_mode: host
    ipc: host
    pid: host

    environment:
      - DISPLAY=${DISPLAY}
      #- XAUTHORITY=${XAUTHORITY}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=90

    volumes:
      - type: bind
        source: "./src"
        target: "/home/developer/projects/reluctant/src"
      - type: bind
        source: "/tmp/.X11-unix"
        target: "/tmp/.X11-unix"

    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1

    stdin_open: true
    tty: true
    command: bash
